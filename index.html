<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shopping">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Shopping</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #0a0a0f;
    color: #e8e8f0;
    padding: 16px;
    padding-bottom: 80px;
    max-width: 500px;
    margin: 0 auto;
  }
  .top-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    position: sticky;
    top: 0;
    background: #0a0a0f;
    padding: 8px 0;
    z-index: 10;
  }
  .top-bar input {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid #222;
    border-radius: 10px;
    font-size: 1rem;
    outline: none;
    background: #111118;
    color: #e8e8f0;
  }
  .top-bar input:focus { border-color: #444; }
  .top-bar input::placeholder { color: #444; }
  .top-bar button {
    padding: 12px 14px;
    border: 1px solid #222;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    background: #111118;
    color: #666;
    cursor: pointer;
    white-space: nowrap;
  }
  .top-bar button.active {
    border-color: #4488ff;
    color: #4488ff;
  }
  .top-bar button.commit {
    border-color: #00ff88;
    color: #00ff88;
  }
  .group {
    border: 1px solid var(--clr);
    border-radius: 14px;
    padding: 10px;
    margin-bottom: 14px;
    background: rgba(255,255,255,0.01);
  }
  .group.done-group {
    opacity: 0.25;
    border-color: #1a1a22;
    margin-top: 20px;
    margin-bottom: 6px;
  }
  .group-label {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--clr);
    margin-bottom: 8px;
    padding-left: 4px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .tile {
    aspect-ratio: 1 / 1;
    border: 1px solid #1a1a22;
    border-radius: 8px;
    background: #111118;
    cursor: pointer;
    user-select: none;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 6px;
    text-align: center;
    position: relative;
  }
  .tile:active { transform: scale(0.95); }
  .tile.done {
    background: #0a0a0f;
    border-color: #111;
  }
  .tile.done .tile-text {
    text-decoration: line-through;
    color: #333;
  }
  .tile-text {
    font-size: 0.7rem;
    font-weight: 500;
    line-height: 1.2;
    word-break: break-word;
    color: #ddd;
  }
  .tile-qty {
    font-size: 0.65rem;
    color: #4488ff;
    font-weight: 700;
    margin-top: 2px;
  }
  .tile .del {
    position: absolute;
    top: 3px;
    right: 4px;
    opacity: 0;
    color: #444;
    font-size: 0.6rem;
    padding: 2px 3px;
    cursor: pointer;
  }
  .tile:hover .del { opacity: 1; }
  .build-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .build-card {
    aspect-ratio: 1 / 1;
    border: 1px solid #1a1a22;
    border-radius: 8px;
    background: #111118;
    cursor: pointer;
    user-select: none;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 6px;
    text-align: center;
    position: relative;
  }
  .build-card:active { transform: scale(0.95); }
  .build-card.has-qty {
    border-color: #4488ff;
    background: #0d1520;
  }
  .build-card .card-text {
    font-size: 0.7rem;
    font-weight: 500;
    line-height: 1.2;
    word-break: break-word;
    color: #ddd;
  }
  .build-card .card-qty {
    font-size: 0.85rem;
    font-weight: 700;
    color: #4488ff;
    margin-top: 4px;
  }
  .build-card .card-freq {
    font-size: 0.55rem;
    color: #333;
    margin-top: 2px;
  }
  .build-card .card-remove {
    position: absolute;
    top: 3px;
    right: 4px;
    opacity: 0;
    color: #444;
    font-size: 0.6rem;
    padding: 2px 3px;
    cursor: pointer;
  }
  .build-card:hover .card-remove { opacity: 1; }
  .progress {
    text-align: center;
    font-size: 0.75rem;
    color: #333;
    margin-bottom: 14px;
  }
  .fab {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: #111118;
    border: 1px solid #222;
    color: #555;
    font-size: 1.3rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    z-index: 100;
  }
  .fab:active { transform: scale(0.93); }
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
  }
  .overlay.open { display: flex; }
  .sheet {
    background: #111118;
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 500px;
    max-height: 70vh;
    overflow-y: auto;
    padding: 24px 20px;
    border-top: 1px solid #222;
  }
  .sheet-title {
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 16px;
    color: #e8e8f0;
  }
  .list-row {
    display: flex;
    align-items: center;
    padding: 12px;
    background: #0a0a0f;
    border-radius: 10px;
    margin-bottom: 6px;
    cursor: pointer;
    gap: 10px;
    border: 1px solid transparent;
  }
  .list-row:active { opacity: 0.7; }
  .list-row.active { border-color: #333; }
  .list-row .name { flex: 1; font-size: 0.9rem; }
  .list-row .count { font-size: 0.75rem; color: #444; }
  .list-row .del-list {
    color: #444;
    padding: 4px 8px;
    font-size: 0.8rem;
    border: none;
    background: none;
    cursor: pointer;
  }
  .sheet-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  .sheet-btn.primary { background: #161620; color: #aaa; }
  .sheet-btn.danger { background: #1a0a0a; color: #a44; }
  .conn {
    text-align: center;
    font-size: 0.65rem;
    color: #222;
    margin-bottom: 10px;
  }
  .conn.ok { color: #1a3a2a; }
  .conn.off { color: #3a1a1a; }
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: #222;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<div class="top-bar">
  <input type="text" id="addInput" placeholder="Add item..." autocomplete="off">
  <button id="addBtn" onclick="addItem()">Add</button>
  <button id="modeListBtn" class="active" onclick="setMode('list')">List</button>
  <button id="modeBuildBtn" onclick="setMode('build')">Build</button>
</div>

<div id="conn" class="conn off">offline</div>
<div id="progress" class="progress"></div>
<div id="content"></div>

<div class="fab" onclick="openSheet()">☰</div>

<div class="overlay" id="overlay" onclick="closeSheet(event)">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-title">Lists</div>
    <div id="listPicker"></div>
    <button class="sheet-btn primary" onclick="duplicateList()">+ Duplicate current</button>
    <button class="sheet-btn primary" onclick="uncheckAll()">↩ Uncheck all</button>
    <button class="sheet-btn danger" onclick="clearChecked()">Clear checked</button>
  </div>
</div>

<script>
const CATS = {
  produce:   { label: 'Produce',   clr: '#00ff88', k: ['apple','banana','orange','grapes','strawberry','lettuce','tomato','cucumber','carrot','onion','potato','avocado','lemon','lime','broccoli','spinach','pepper','corn','watermelon','pineapple','mango','peach','berries','celery','mushroom','garlic','ginger','herbs','salad'] },
  dairy:     { label: 'Dairy',     clr: '#ffcc00', k: ['milk','cheese','yogurt','butter','cream','egg','eggs','sour cream','cottage cheese','mozzarella','parmesan','cheddar'] },
  meat:      { label: 'Meat',      clr: '#ff4444', k: ['chicken','beef','pork','bacon','sausage','ham','turkey','steak','ground beef','salmon','shrimp','fish','tuna','deli'] },
  bakery:    { label: 'Bakery',    clr: '#ff8844', k: ['bread','bagel','rolls','buns','tortilla','croissant','muffin','cake','cookies','pie','pita','naan'] },
  snacks:    { label: 'Snacks',    clr: '#cc66ff', k: ['chips','crackers','nuts','trail mix','granola','candy','chocolate','popcorn','pretzels','fruit snacks','gummies','beef jerky','rice cakes'] },
  drinks:    { label: 'Drinks',    clr: '#4488ff', k: ['water','juice','soda','coffee','tea','beer','wine','sparkling water','iced tea','lemonade','coconut water','energy drink'] },
  frozen:    { label: 'Frozen',    clr: '#88ddff', k: ['ice cream','frozen pizza','frozen veggies','frozen fruit','ice','frozen meal','waffles','popsicle','frozen yogurt','ice cubes'] },
  household: { label: 'Household', clr: '#ff66aa', k: ['paper towels','toilet paper','napkins','plates','cups','utensils','trash bags','aluminum foil','plastic wrap','ziploc','cleaning wipes','sunscreen','bug spray','batteries','soap','shampoo','toothpaste','tissues','hand sanitizer'] },
  beach:     { label: 'Beach',     clr: '#00d4ff', k: ['sunscreen','beach towel','umbrella','cooler','beach toys','snorkel','float','beach bag','hat','sunglasses','flip flops','water shoes','beach blanket','beach chair'] },
  other:     { label: 'Other',     clr: '#555555', k: [] }
};

const CAT_ORDER = ['beach','produce','dairy','meat','bakery','snacks','drinks','frozen','household','other'];

function catFor(name) {
  const l = name.toLowerCase();
  for (const [key, c] of Object.entries(CATS)) {
    if (key === 'other') continue;
    for (const kw of c.k) {
      if (l.includes(kw) || kw.includes(l)) return key;
    }
  }
  return 'other';
}

let lists = {}, curKey = 'default', ws = null;
let itemFrequency = {}, knownItems = [];
let mode = 'list';
let buildQuantities = {};
let buildSearch = '';

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host);
  ws.onopen = () => { document.getElementById('conn').textContent = 'synced'; document.getElementById('conn').className = 'conn ok'; };
  ws.onclose = () => { document.getElementById('conn').textContent = 'offline'; document.getElementById('conn').className = 'conn off'; setTimeout(connect, 2000); };
  ws.onerror = () => { document.getElementById('conn').textContent = 'offline'; document.getElementById('conn').className = 'conn off'; };
  ws.onmessage = (e) => {
    const d = JSON.parse(e.data);
    if (d.type === 'init' || d.type === 'update') {
      lists = d.lists;
      curKey = d.currentListKey;
      itemFrequency = d.itemFrequency || {};
      knownItems = d.knownItems || [];
      render();
    }
  };
}

function send(d) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(d)); }

function cur() { return lists[curKey] || { name: 'Unknown', items: [] }; }

function setMode(m) {
  mode = m;
  document.getElementById('modeListBtn').className = m === 'list' ? 'active' : '';
  document.getElementById('modeBuildBtn').className = m === 'build' ? 'active' : '';
  if (m === 'build') {
    document.getElementById('addInput').placeholder = 'Search items...';
    document.getElementById('addBtn').textContent = 'Done';
    document.getElementById('addBtn').className = 'commit';
    document.getElementById('addBtn').onclick = buildCommit;
    buildQuantities = {};
    const curItems = cur().items;
    for (const item of curItems) {
      buildQuantities[item.name.toLowerCase()] = item.qty || 1;
    }
  } else {
    document.getElementById('addInput').placeholder = 'Add item...';
    document.getElementById('addBtn').textContent = 'Add';
    document.getElementById('addBtn').className = '';
    document.getElementById('addBtn').onclick = addItem;
  }
  render();
}

function render() {
  if (mode === 'build') renderBuild();
  else renderList();
}

function renderList() {
  const list = cur();
  const grouped = {};
  for (const item of list.items) {
    const c = item.category || catFor(item.name);
    if (!grouped[c]) grouped[c] = [];
    grouped[c].push(item);
  }

  const el = document.getElementById('content');
  if (list.items.length === 0) {
    el.innerHTML = '<div class="empty">Add items above or switch to Build mode</div>';
    document.getElementById('progress').textContent = '';
    return;
  }

  const activeGroups = [];
  const doneGroups = [];

  for (const ck of CAT_ORDER) {
    if (!grouped[ck]) continue;
    const c = CATS[ck];
    const items = grouped[ck];
    const allDone = items.every(i => i.checked);
    if (allDone) doneGroups.push({ key: ck, cat: c, items });
    else activeGroups.push({ key: ck, cat: c, items });
  }

  const order = [...activeGroups, ...doneGroups];
  let h = '';
  for (const g of order) {
    h += '<div class="group' + (g.allDone ? ' done-group' : '') + '" style="--clr:' + g.cat.clr + '">';
    h += '<div class="group-label">' + g.cat.label + '</div>';
    h += '<div class="grid">';
    for (let i = 0; i < g.items.length; i++) {
      const item = g.items[i];
      const idx = list.items.indexOf(item);
      h += '<div class="tile' + (item.checked ? ' done' : '') + '" onclick="toggle(' + idx + ')">';
      h += '<span class="tile-text">' + esc(item.name) + '</span>';
      if (item.qty > 1) h += '<span class="tile-qty">×' + item.qty + '</span>';
      h += '<span class="del" onclick="event.stopPropagation();del(' + idx + ')">✕</span>';
      h += '</div>';
    }
    h += '</div></div>';
  }
  el.innerHTML = h;

  const total = list.items.length;
  const done = list.items.filter(i => i.checked).length;
  document.getElementById('progress').textContent = done + ' / ' + total;
}

function renderBuild() {
  const el = document.getElementById('content');
  const curItems = cur().items;
  const curNames = new Set(curItems.map(i => i.name.toLowerCase()));

  let items = knownItems.filter(i => !buildSearch || i.name.toLowerCase().includes(buildSearch.toLowerCase()));

  if (items.length === 0) {
    el.innerHTML = '<div class="empty">No items found</div>';
    document.getElementById('progress').textContent = '';
    return;
  }

  let h = '<div class="build-grid">';
  for (const item of items) {
    const key = item.name.toLowerCase();
    const qty = buildQuantities[key] || 0;
    h += '<div class="build-card' + (qty > 0 ? ' has-qty' : '') + '" onclick="buildTap(\'' + esc(key) + '\')">';
    h += '<span class="card-text">' + esc(item.name) + '</span>';
    if (qty > 0) h += '<span class="card-qty">×' + qty + '</span>';
    h += '<span class="card-freq">' + item.freq + '</span>';
    if (qty > 0) h += '<span class="card-remove" onclick="event.stopPropagation();buildRemove(\'' + esc(key) + '\')">✕</span>';
    h += '</div>';
  }
  h += '</div>';
  el.innerHTML = h;

  const total = Object.values(buildQuantities).reduce((s, q) => s + q, 0);
  document.getElementById('progress').textContent = total + ' items selected';
}

function buildTap(key) {
  const item = knownItems.find(i => i.name.toLowerCase() === key);
  if (!item) return;
  buildQuantities[key] = (buildQuantities[key] || 0) + 1;
  renderBuild();
}

function buildRemove(key) {
  delete buildQuantities[key];
  renderBuild();
}

function buildCommit() {
  const list = cur();
  const curNames = new Set(list.items.map(i => i.name.toLowerCase()));

  for (const [key, qty] of Object.entries(buildQuantities)) {
    if (qty <= 0) continue;
    if (curNames.has(key)) {
      const idx = list.items.findIndex(i => i.name.toLowerCase() === key);
      if (idx >= 0) send({ type: 'set_qty', index: idx, qty: qty });
    } else {
      const item = knownItems.find(i => i.name.toLowerCase() === key);
      if (item) send({ type: 'add_item', item: { name: item.name, category: item.category, checked: false, qty: qty } });
    }
  }
  buildQuantities = {};
  buildSearch = '';
  document.getElementById('addInput').value = '';
  setMode('list');
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function addItem() {
  const inp = document.getElementById('addInput');
  const name = inp.value.trim();
  if (!name) return;
  send({ type: 'add_item', item: { name, category: catFor(name), checked: false, qty: 1 } });
  inp.value = '';
  inp.focus();
}

function toggle(i) { send({ type: 'toggle_item', index: i }); }
function del(i) { send({ type: 'delete_item', index: i }); }
function clearChecked() { send({ type: 'clear_checked' }); closeSheetDirect(); }
function uncheckAll() { send({ type: 'uncheck_all' }); closeSheetDirect(); }
function duplicateList() { send({ type: 'duplicate_list' }); closeSheetDirect(); }

function openSheet() {
  const lp = document.getElementById('listPicker');
  let h = '';
  for (const [key, val] of Object.entries(lists)) {
    const total = val.items.length;
    const done = val.items.filter(i => i.checked).length;
    h += '<div class="list-row' + (key === curKey ? ' active' : '') + '" onclick="switchList(\'' + key + '\')">';
    h += '<span class="name">' + esc(val.name) + '</span>';
    h += '<span class="count">' + done + '/' + total + '</span>';
    if (Object.keys(lists).length > 1) {
      h += '<button class="del-list" onclick="event.stopPropagation();deleteList(\'' + key + '\')">✕</button>';
    }
    h += '</div>';
  }
  lp.innerHTML = h;
  document.getElementById('overlay').classList.add('open');
}

function closeSheet(e) { if (e.target === document.getElementById('overlay')) document.getElementById('overlay').classList.remove('open'); }
function closeSheetDirect() { document.getElementById('overlay').classList.remove('open'); }
function switchList(k) { send({ type: 'switch_list', key: k }); closeSheetDirect(); }
function deleteList(k) { if (Object.keys(lists).length > 1 && confirm('Delete?')) { send({ type: 'delete_list', key: k }); } }

const addInput = document.getElementById('addInput');
addInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    if (mode === 'build') {
      buildSearch = addInput.value.trim();
      renderBuild();
    } else {
      addItem();
    }
  }
});
addInput.addEventListener('input', () => {
  if (mode === 'build') {
    buildSearch = addInput.value.trim();
    renderBuild();
  }
});

connect();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/service-worker.js');

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });
</script>
</body>
</html>
